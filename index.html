<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ani-rate">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<title>ani-rate</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef0f4; --line:#d8dce4;
  --fg:#1b1d22; --fg2:#5c6270; --accent:#3d7dff; --accent2:#e8f0ff;
  --good:#2e9e5b; --mid:#c99a20; --bad:#c9482f;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15171b; --panel:#1e2127; --panel2:#272b33; --line:#343a45;
    --fg:#e6e8ec; --fg2:#98a0ae; --accent:#5b93ff; --accent2:#22304d;
    --good:#48c07a; --mid:#e0b53f; --bad:#e2694c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 文字サイズは html の font-size で一括変更する。以降の指定はすべて rem */
html{font-size:17px}
html[data-fs="s"]{font-size:15px}
html[data-fs="m"]{font-size:17px}
html[data-fs="l"]{font-size:19.5px}
html[data-fs="xl"]{font-size:22.5px}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:1rem; line-height:1.65; padding-bottom:calc(4.2rem + env(safe-area-inset-bottom));
}
header{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line); padding:.65rem .7rem;
  display:flex; align-items:center; gap:8px;
}
header h1{font-size:1.12rem;margin:0;font-weight:700;letter-spacing:.02em}
header .ver{font-size:.76rem;color:var(--fg2);font-weight:400}
header .sync{margin-left:auto;font-size:.76rem;color:var(--fg2)}
main{padding:12px;max-width:820px;margin:0 auto}
section{display:none}
section.active{display:block}

nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--panel); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  background:none;border:none;color:var(--fg2);font-size:.76rem;
  padding:.5rem 2px .6rem; cursor:pointer; font-family:inherit;
}
nav button .ic{display:block;font-size:1.24rem;line-height:1.2}
nav button.on{color:var(--accent);font-weight:700}
nav button .badge{
  display:inline-block;min-width:1.12rem;padding:0 .3rem;margin-left:2px;
  background:var(--bad);color:#fff;border-radius:1rem;font-size:.71rem;line-height:1.12rem;
}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:.82rem; margin-bottom:.65rem;
}
.card h3{margin:0 0 .4rem;font-size:1.06rem;line-height:1.45}
.meta{font-size:.82rem;color:var(--fg2);margin-bottom:.5rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

button.btn{
  font-family:inherit;font-size:.94rem;padding:.47rem .7rem;border-radius:8px;
  border:1px solid var(--line); background:var(--panel2); color:var(--fg); cursor:pointer;
}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.btn.sm{font-size:.82rem;padding:.3rem .53rem}
button.btn:disabled{opacity:.45;cursor:default}

/* ◎○△… の6段階。1タップで押せるよう横一列に並べる */
.marks{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.mark{
  font-size:1.3rem; padding:.66rem 0; border-radius:10px;
  border:1px solid var(--line); background:var(--panel2); color:var(--fg); cursor:pointer;
  font-family:inherit;
}
.mark.m1{color:var(--good);font-weight:700}
.mark.m2{color:var(--good)}
.mark.m3{color:var(--fg)}
.mark.m4{color:var(--mid)}
.mark.m5{color:var(--bad)}
.mark.m6{color:var(--fg2)}
.mark.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

.next-ep{font-size:1.5rem;font-weight:700;line-height:1.3;margin:.1rem 0 .35rem}
.next-ep b{font-size:2.1rem;color:var(--accent);margin:0 .1em}

input[type=text],input[type=number],input[type=password],textarea,select{
  font-family:inherit;font-size:1rem;padding:.47rem .6rem;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;
}
textarea{min-height:4.2rem;resize:vertical}
label.f{display:block;margin:.6rem 0 .24rem;font-size:.76rem;color:var(--fg2)}

.eps{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.ep{
  width:1.9rem;height:1.9rem;line-height:1.9rem;text-align:center;border-radius:5px;
  font-size:.76rem;background:var(--panel2);border:1px solid var(--line);
  cursor:pointer;position:relative;padding:0;font-family:inherit;color:var(--fg);
}
.ep.m1{background:var(--good);color:#fff;border-color:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.ep.m2{background:var(--good);color:#fff;border-color:transparent}
.ep.m3{background:var(--panel2)}
.ep.m4{background:var(--mid);color:#fff;border-color:transparent}
.ep.m5{background:var(--bad);color:#fff;border-color:transparent}
.ep.m6{background:transparent;color:var(--fg2);border-style:dashed}
/* メモが付いている話は右上に点を出す。どこにコメントを書いたか一目で分かる */
.ep.has::after{
  content:'';position:absolute;top:1px;right:1px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--panel);
}

/* 話ごとの振り返り一覧 */
.eprow{display:flex;gap:8px;align-items:flex-start;padding:.5rem .1rem;border-bottom:1px solid var(--line);cursor:pointer}
.eprow:last-child{border-bottom:none}
.eprow .no{min-width:2.9rem;font-size:.82rem;color:var(--fg2);padding-top:.15rem}
.eprow .mk{min-width:1.6rem;text-align:center;font-size:1.15rem;line-height:1.4}
.eprow .mk.m1,.eprow .mk.m2{color:var(--good)}
.eprow .mk.m4{color:var(--mid)}
.eprow .mk.m5{color:var(--bad)}
.eprow .mk.m6{color:var(--fg2)}
.eprow .cm{flex:1;min-width:0;font-size:.94rem;white-space:pre-wrap;word-break:break-word}
.eprow .cm.none{color:var(--fg2);font-size:.82rem}

/* 点数入力。10の位と1の位を上下ボタンで動かす */
.scval{text-align:center;font-size:3.4rem;font-weight:700;line-height:1.1;margin:.2rem 0}
.stepper{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stepper .col{display:grid;gap:5px;justify-items:center}
.stepper .col .lb{font-size:.76rem;color:var(--fg2)}
.stepper .col .dg{font-size:1.9rem;font-weight:700;line-height:1.2}
.stepper button{
  font-family:inherit;font-size:1.3rem;font-weight:700;width:100%;padding:.5rem 0;
  border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;
}
.stepper button:active{background:var(--accent);border-color:var(--accent);color:#fff}

.list-item{
  display:flex;gap:10px;align-items:center;padding:.53rem .6rem;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.list-item:last-child{border-bottom:none}
.sc{
  min-width:2.7rem;text-align:center;font-weight:700;font-size:1rem;
  padding:3px 0;border-radius:6px;background:var(--panel2);
}
.sc.s90{background:var(--good);color:#fff}
.sc.s75{background:var(--accent);color:#fff}
.sc.s55{background:var(--panel2)}
.sc.s0{background:var(--bad);color:#fff}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:.76rem;color:var(--fg2)}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat .b{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6rem}
.stat .b .n{font-size:1.5rem;font-weight:700}
.stat .b .l{font-size:.76rem;color:var(--fg2)}

.hist{display:flex;align-items:flex-end;gap:2px;height:7rem;margin-top:8px}
.hist .bar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.hist .bar span{position:absolute;bottom:-1.1rem;left:0;right:0;text-align:center;font-size:.65rem;color:var(--fg2)}
.histwrap{padding-bottom:1.2rem}

.modal{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);
  display:none;align-items:flex-end;justify-content:center;
}
.modal.on{display:flex}
.modal .inner{
  background:var(--panel);width:100%;max-width:820px;max-height:88vh;overflow:auto;
  border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
}
.note{font-size:.82rem;color:var(--fg2);margin:6px 0}
.warn{background:var(--accent2);border:1px solid var(--accent);border-radius:8px;padding:.53rem;font-size:.82rem;margin:8px 0}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.empty{text-align:center;color:var(--fg2);padding:1.8rem .6rem;font-size:.88rem}

.fsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.fsgrid button{
  font-family:inherit;font-size:1rem;padding:.6rem 0;border-radius:8px;
  border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;
}
.fsgrid button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
</style>
<script>
// 描画前にサイズを当てる。後から当てると一瞬小さく表示されてちらつく
try{ document.documentElement.dataset.fs = localStorage.getItem('anirate_fs') || 'm'; }catch(e){}
</script>
</head>
<body>

<header>
  <h1>ani-rate <span class="ver">1.03</span></h1>
  <span class="sync" id="sync-state">未同期</span>
</header>

<main>
  <!-- 視聴中 -->
  <section id="s-watch">
    <div class="row" style="margin-bottom:10px">
      <button class="btn pri" onclick="openEdit(null)">＋ 作品を追加</button>
    </div>
    <div id="watch-list"></div>
  </section>

  <!-- 採点待ち -->
  <section id="s-score">
    <div id="score-list"></div>
  </section>

  <!-- 一覧 -->
  <section id="s-list">
    <input type="text" id="q" placeholder="タイトル検索" oninput="renderList()">
    <div class="row" style="margin:8px 0">
      <select id="sort" onchange="renderList()" style="flex:1">
        <option value="seq">視聴順（新しい順）</option>
        <option value="seqAsc">視聴順（古い順）</option>
        <option value="score">点数が高い順</option>
        <option value="scoreAsc">点数が低い順</option>
      </select>
      <select id="filt" onchange="renderList()" style="flex:1">
        <option value="all">すべて</option>
        <option value="watching">視聴中</option>
        <option value="done">完走</option>
        <option value="unscored">未採点</option>
        <option value="dropped">中断</option>
      </select>
    </div>
    <div class="note" id="list-count"></div>
    <div class="card" style="padding:0" id="all-list"></div>
  </section>

  <!-- 統計 -->
  <section id="s-stat"><div id="stat-body"></div></section>

  <!-- 設定 -->
  <section id="s-conf">
    <div class="card">
      <h3>文字サイズ</h3>
      <div class="fsgrid">
        <button id="fs-s"  onclick="setFs('s')">小</button>
        <button id="fs-m"  onclick="setFs('m')">中</button>
        <button id="fs-l"  onclick="setFs('l')">大</button>
        <button id="fs-xl" onclick="setFs('xl')">特</button>
      </div>
      <div class="note">この端末だけの設定です。Gist には送りません。</div>
    </div>

    <div class="card">
      <h3>基準作品（アンカー）</h3>
      <div class="note">各点数の基準になる作品名を書いておくと、採点がブレません。</div>
      <div id="anchor-fields"></div>
      <button class="btn" onclick="saveAnchors()">保存</button>
    </div>

    <div class="card">
      <h3>Gist 同期</h3>
      <div class="note">非公開 Gist に JSON を置き、スマホ・PC で共有します。</div>
      <div class="warn">トークンはこの端末の localStorage にのみ保存されます。リポジトリには絶対に含めないでください。</div>
      <label class="f">GitHub トークン（gist スコープのみ）</label>
      <input type="password" id="gh-token" placeholder="ghp_... / github_pat_...">
      <label class="f">Gist ID</label>
      <input type="text" id="gh-gist" placeholder="未作成なら空のまま">
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="saveGistConf()">設定を保存</button>
        <button class="btn" onclick="gistCreate()">新規Gistを作る</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn pri" onclick="gistPush(true)">この端末 → Gist</button>
        <button class="btn" onclick="gistPull()">Gist → この端末</button>
      </div>
      <div class="note" id="gist-msg"></div>
    </div>

    <div class="card">
      <h3>インポート / エクスポート</h3>
      <div class="note">anime.xlsx から変換した anime_import.json を読み込めます。</div>
      <input type="file" id="imp-file" accept=".json,application/json">
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="doImport()">インポート</button>
        <button class="btn" onclick="doExport()">JSONを書き出す</button>
      </div>
      <div class="note" id="imp-msg"></div>
    </div>

    <div class="card">
      <h3>データ</h3>
      <div class="note" id="data-info"></div>
      <button class="btn" onclick="wipe()">この端末のデータを消去</button>
    </div>
  </section>
</main>

<nav>
  <button id="n-watch" class="on" onclick="go('watch')"><span class="ic">▶</span>視聴中</button>
  <button id="n-score" onclick="go('score')"><span class="ic">★</span>採点<span class="badge" id="b-score" style="display:none">0</span></button>
  <button id="n-list"  onclick="go('list')"><span class="ic">≡</span>一覧</button>
  <button id="n-stat"  onclick="go('stat')"><span class="ic">◧</span>統計</button>
  <button id="n-conf"  onclick="go('conf')"><span class="ic">⚙</span>設定</button>
</nav>

<!-- 作品の追加・編集 -->
<div class="modal" id="m-edit">
  <div class="inner">
    <h3 id="edit-title">作品を追加</h3>
    <label class="f">タイトル</label>
    <input type="text" id="e-title">
    <label class="f">視聴年（任意）</label>
    <input type="number" id="e-year" placeholder="2026">
    <label class="f">放送開始日（任意）</label>
    <input type="date" id="e-air">
    <div class="note" id="e-air-note"></div>
    <label class="f">状態</label>
    <select id="e-status">
      <option value="watching">視聴中</option>
      <option value="done">完走</option>
      <option value="dropped">中断</option>
    </select>
    <label class="f">メモ</label>
    <textarea id="e-note"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" onclick="saveEdit()">保存</button>
      <button class="btn" onclick="closeModal('m-edit')">閉じる</button>
      <span class="spacer"></span>
      <button class="btn" id="e-del" onclick="delWork()">削除</button>
    </div>
  </div>
</div>

<!-- 採点 -->
<div class="modal" id="m-score">
  <div class="inner">
    <h3 id="sc-title"></h3>
    <div id="sc-eps"></div>
    <div class="note" id="sc-ref"></div>
    <hr>
    <div class="note" id="sc-anchor"></div>
    <div class="scval" id="sc-val">—</div>
    <div class="stepper">
      <div class="col">
        <div class="lb">10の位</div>
        <button onclick="bumpScore(10)">＋</button>
        <div class="dg" id="sc-d10">0</div>
        <button onclick="bumpScore(-10)">−</button>
      </div>
      <div class="col">
        <div class="lb">1の位</div>
        <button onclick="bumpScore(1)">＋</button>
        <div class="dg" id="sc-d1">0</div>
        <button onclick="bumpScore(-1)">−</button>
      </div>
    </div>
    <label class="f">一言メモ</label>
    <textarea id="sc-note"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" onclick="saveScore()">この点数で確定</button>
      <button class="btn" onclick="closeModal('m-score')">閉じる</button>
    </div>
  </div>
</div>

<!-- 話ごとの振り返り（一覧から開く） -->
<div class="modal" id="m-eps">
  <div class="inner">
    <h3 id="eps-title"></h3>
    <div class="meta" id="eps-meta"></div>
    <div id="eps-body"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" onclick="openScoreFromEps()">採点する</button>
      <button class="btn" onclick="openEditFromEps()">編集</button>
      <span class="spacer"></span>
      <button class="btn" onclick="closeModal('m-eps')">閉じる</button>
    </div>
  </div>
</div>

<!-- 話ごとメモ -->
<div class="modal" id="m-ep">
  <div class="inner">
    <h3 id="ep-title"></h3>
    <label class="f">評価</label>
    <div class="marks" id="ep-marks"></div>
    <label class="f">一言メモ</label>
    <textarea id="ep-note"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" onclick="saveEpNote()">保存</button>
      <button class="btn" onclick="closeModal('m-ep')">閉じる</button>
      <span class="spacer"></span>
      <button class="btn" onclick="delEp()">この話を削除</button>
    </div>
  </div>
</div>

<script>
'use strict';

const LS_DB='anirate_db', LS_TOKEN='anirate_token', LS_GIST='anirate_gist',
      LS_PEND='anirate_pending', LS_FS='anirate_fs';
// 6段階。'-' は未回答で、参考平均の計算からは外す
const MARKS=['☆','◎','○','△','×','-'];
const MARK_PT={'☆':10,'◎':8,'○':6,'△':4,'×':2,'-':null};
const ANCHOR_KEYS=[100,90,80,70,60,50];
const MEDIA={movie:'劇場',ova:'OVA',sp:'特番',tv:''};
const COUR=['','1月期','4月期','7月期','10月期'];
const STATUS_JA={watching:'視聴中',done:'完走',dropped:'中断'};

let DB=null, curId=null, curEp=null, epsId=null, epPick=null, scPick=null, gistBase=null;

// ---------- 基盤 ----------
function nowISO(){ return new Date().toISOString(); }
function uid(){ return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function emptyDB(){
  const a={}; ANCHOR_KEYS.forEach(k=>a[k]='');
  return { version:1, updatedAt:nowISO(), anchors:a, works:[] };
}
function load(){
  try{ const s=localStorage.getItem(LS_DB); DB = s ? JSON.parse(s) : emptyDB(); }
  catch(e){ DB=emptyDB(); }
  if(!DB.anchors) DB.anchors={};
  ANCHOR_KEYS.forEach(k=>{ if(DB.anchors[k]==null) DB.anchors[k]=''; });
  if(!Array.isArray(DB.works)) DB.works=[];
}
function save(touch){
  if(touch!==false) DB.updatedAt=nowISO();
  try{ localStorage.setItem(LS_DB, JSON.stringify(DB)); }
  catch(e){ alert('保存に失敗しました。容量超過の可能性があります。'); }
}
function nextSeq(){ return DB.works.reduce((m,w)=>Math.max(m, w.seq||0), 0) + 1; }
function byId(id){ return DB.works.find(w=>w.id===id); }

// ---------- 表示のための小道具 ----------
function mkCls(m){ const i=MARKS.indexOf(m); return 'm'+(i<0?3:i+1); }
// 視聴年。xlsx から推定した年は「推定」と付けて、確定した年と混ぜない
function yearLabel(w){ return w.year? w.year+'年'+(w.yearEst?'（推定）':'') : ''; }
// 放送日。日付が入っていればそれを、なければ取り込んだクールを出す
function airLabel(w){
  if(w.airDate) return w.airDate.replace(/-/g,'/')+' 放送開始';
  const md = w.media && MEDIA[w.media] ? MEDIA[w.media] : '';
  if(w.airYear) return w.airYear+'年'+(w.airCour?COUR[w.airCour]:'')+(md?' '+md:'')+' 放送';
  return md;
}
function epChip(w,e,i){
  return `<button class="ep ${mkCls(e.mark)}${e.note?' has':''}" title="${esc(e.note||'')}"
    onclick="event.stopPropagation();openEp('${w.id}',${i})">${e.no}</button>`;
}
// 参考平均。'-'（未回答）は分母から外す
function markStats(eps){
  const c={}; MARKS.forEach(m=>c[m]=0);
  eps.forEach(e=>{ if(c[e.mark]!=null) c[e.mark]++; });
  const v=eps.filter(e=>MARK_PT[e.mark]!=null);
  return {c, n:v.length, ref: v.length? v.reduce((s,e)=>s+MARK_PT[e.mark],0)/v.length*10 : null};
}

// ---------- 画面遷移 ----------
function go(name){
  ['watch','score','list','stat','conf'].forEach(n=>{
    document.getElementById('s-'+n).classList.toggle('active', n===name);
    document.getElementById('n-'+n).classList.toggle('on', n===name);
  });
  if(name==='watch') renderWatch();
  if(name==='score') renderScoreList();
  if(name==='list')  renderList();
  if(name==='stat')  renderStat();
  if(name==='conf')  renderConf();
}
function openModal(id){ document.getElementById(id).classList.add('on'); }
function closeModal(id){ document.getElementById(id).classList.remove('on'); }

// ---------- 視聴中 ----------
function renderWatch(){
  const list=DB.works.filter(w=>w.status==='watching').sort((a,b)=>b.seq-a.seq);
  const el=document.getElementById('watch-list');
  if(!list.length){ el.innerHTML='<div class="empty">視聴中の作品はありません。<br>「＋ 作品を追加」から登録してください。</div>'; return; }
  el.innerHTML=list.map(w=>{
    const next=(w.episodes||[]).length+1;
    const eps=(w.episodes||[]).map((e,i)=>epChip(w,e,i)).join('');
    const sub=[yearLabel(w),airLabel(w)].filter(Boolean).join(' ・ ');
    return `<div class="card">
      <h3>${esc(w.title)}</h3>
      <div class="next-ep">次は <b>${next}</b> 話</div>
      ${sub?`<div class="meta">${esc(sub)}</div>`:''}
      <div class="marks">
        ${MARKS.map((m,i)=>`<button class="mark m${i+1}" onclick="addEp('${w.id}','${m}')">${m}</button>`).join('')}
      </div>
      ${eps?`<div class="eps">${eps}</div>`:''}
      <div class="row" style="margin-top:10px">
        <button class="btn sm" onclick="undoEp('${w.id}')">1話戻す</button>
        <button class="btn sm" onclick="epNote('${w.id}')">直前にメモ</button>
        <button class="btn sm" onclick="openEps('${w.id}')">振り返り</button>
        <span class="spacer"></span>
        <button class="btn sm" onclick="openEdit('${w.id}')">編集</button>
        <button class="btn sm pri" onclick="finish('${w.id}')">完走</button>
      </div>
    </div>`;
  }).join('');
}
function addEp(id,mark){
  const w=byId(id); if(!w) return;
  w.episodes=w.episodes||[];
  w.episodes.push({no:w.episodes.length+1, mark:mark, note:'', at:nowISO()});
  save(); renderWatch(); queueSync();
}
function undoEp(id){
  const w=byId(id); if(!w||!(w.episodes||[]).length) return;
  w.episodes.pop(); save(); renderWatch(); queueSync();
}
function epNote(id){
  const w=byId(id); if(!w||!(w.episodes||[]).length){ alert('先に話を記録してください。'); return; }
  openEp(id, w.episodes.length-1);
}

// 記録済みの話をあとから開く。評価の付け直しとメモの書き足しができる
function openEp(id,idx){
  const w=byId(id); if(!w||!(w.episodes||[])[idx]) return;
  curId=id; curEp=idx; epPick=w.episodes[idx].mark;
  document.getElementById('ep-title').textContent=w.title+' '+w.episodes[idx].no+'話';
  document.getElementById('ep-note').value=w.episodes[idx].note||'';
  buildEpMarks();
  openModal('m-ep');
}
function buildEpMarks(){
  document.getElementById('ep-marks').innerHTML=MARKS.map((m,i)=>
    `<button class="mark m${i+1}${m===epPick?' on':''}" onclick="pickEpMark('${m}')">${m}</button>`).join('');
}
function pickEpMark(m){ epPick=m; buildEpMarks(); }
function saveEpNote(){
  const w=byId(curId); if(!w||!(w.episodes||[])[curEp]) return;
  w.episodes[curEp].note=document.getElementById('ep-note').value.trim();
  if(epPick) w.episodes[curEp].mark=epPick;
  save(); closeModal('m-ep'); refreshEpViews(); queueSync();
}
function delEp(){
  const w=byId(curId); if(!w||!(w.episodes||[])[curEp]) return;
  if(!confirm('この話の記録を削除します。よろしいですか。')) return;
  w.episodes.splice(curEp,1);
  w.episodes.forEach((e,i)=>{ e.no=i+1; });
  save(); closeModal('m-ep'); refreshEpViews(); queueSync();
}
// 話を直すと視聴中カード・振り返り・採点画面のどれもが古くなるので、開いているものだけ描き直す
function refreshEpViews(){
  renderWatch();
  if(document.getElementById('m-eps').classList.contains('on')) renderEps();
  if(document.getElementById('m-score').classList.contains('on')) renderScoreEps();
}

// ---------- 話ごとの振り返り ----------
function openEps(id){
  const w=byId(id); if(!w) return;
  epsId=id;
  document.getElementById('eps-title').textContent=w.title;
  renderEps();
  openModal('m-eps');
}
function renderEps(){
  const w=byId(epsId); if(!w) return;
  const eps=w.episodes||[];
  document.getElementById('eps-meta').innerHTML=
    [ w.score!=null?`<b>${esc(w.score)}点</b>`:'未採点',
      STATUS_JA[w.status]||'', esc(yearLabel(w)), esc(airLabel(w)), '#'+esc(w.seq) ]
    .filter(Boolean).join(' ・ ')
    + (w.note?`<div style="margin-top:4px">${esc(w.note)}</div>`:'');
  let h='';
  if(eps.length){
    const s=markStats(eps);
    h+=`<div class="eps">${eps.map((e,i)=>epChip(w,e,i)).join('')}</div>`;
    h+=`<div class="note">${MARKS.map(m=>m+s.c[m]).join(' ')}${s.ref!=null?` ／ 参考平均 ${s.ref.toFixed(1)}点`:''}</div>`;
    h+=eps.map((e,i)=>`<div class="eprow" onclick="openEp('${w.id}',${i})">
      <div class="no">${e.no}話</div>
      <div class="mk ${mkCls(e.mark)}">${esc(e.mark)}</div>
      <div class="cm${e.note?'':' none'}">${e.note?esc(e.note):'（メモなし）'}</div>
    </div>`).join('');
  }else{
    h+='<div class="note">話ごとの記録はありません。</div>';
  }
  const sc=w.epScores||[];
  if(sc.length) h+=`<div class="note">xlsx 由来の話ごと点数：${sc.map(x=>x.no+'話 '+x.score).join(' / ')}</div>`;
  h+=`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="addEpFromEps()">＋ 話を追加</button></div>`;
  document.getElementById('eps-body').innerHTML=h;
}
function addEpFromEps(){
  const w=byId(epsId); if(!w) return;
  w.episodes=w.episodes||[];
  w.episodes.push({no:w.episodes.length+1, mark:'-', note:'', at:nowISO()});
  save(); renderEps(); queueSync();
  openEp(w.id, w.episodes.length-1);
}
function openScoreFromEps(){ const id=epsId; closeModal('m-eps'); openScore(id); }
function openEditFromEps(){ const id=epsId; closeModal('m-eps'); openEdit(id); }

function finish(id){
  const w=byId(id); if(!w) return;
  w.status='done'; save(); queueSync();
  openScore(id);
}

// ---------- 採点 ----------
function unscored(){ return DB.works.filter(w=>w.status==='done' && w.score==null); }
function renderScoreList(){
  const list=unscored().sort((a,b)=>b.seq-a.seq);
  const el=document.getElementById('score-list');
  if(!list.length){ el.innerHTML='<div class="empty">採点待ちの作品はありません。</div>'; return; }
  el.innerHTML=list.map(w=>`<div class="card">
    <h3>${esc(w.title)}</h3>
    <div class="meta">${(w.episodes||[]).length}話 記録済み</div>
    <button class="btn pri" onclick="openScore('${w.id}')">採点する</button>
  </div>`).join('');
}
function openScore(id){
  const w=byId(id); if(!w) return;
  curId=id; scPick=w.score!=null?w.score:null;
  document.getElementById('sc-title').textContent=w.title;
  renderScoreEps();
  document.getElementById('sc-anchor').innerHTML = ANCHOR_KEYS
    .filter(k=>DB.anchors[k]).map(k=>`${k}＝${esc(DB.anchors[k])}`).join(' ／ ') || '基準作品は設定タブで登録できます。';
  document.getElementById('sc-note').value=w.note||'';
  showScore();
  openModal('m-score');
}
// 採点しながら各話のコメントを読み返せるようにする。ここが採点の根拠になる
function renderScoreEps(){
  const w=byId(curId); if(!w) return;
  const eps=w.episodes||[];
  let h='';
  if(eps.length){
    h+=`<div class="eps">${eps.map((e,i)=>epChip(w,e,i)).join('')}</div>`;
    const noted=eps.filter(e=>e.note);
    if(noted.length) h+=noted.map(e=>{
      const i=eps.indexOf(e);
      return `<div class="eprow" onclick="openEp('${w.id}',${i})">
        <div class="no">${e.no}話</div>
        <div class="mk ${mkCls(e.mark)}">${esc(e.mark)}</div>
        <div class="cm">${esc(e.note)}</div></div>`;
    }).join('');
  }else{
    h+='<div class="note">話ごとの記録はありません。</div>';
  }
  document.getElementById('sc-eps').innerHTML=h;
  const s=markStats(eps);
  document.getElementById('sc-ref').textContent = eps.length
    ? `${MARKS.map(m=>m+s.c[m]).join(' ')}${s.ref!=null?` ／ 参考平均 ${s.ref.toFixed(1)}点`:''}（最終点数はご自身の判断で）` : '';
}
// 1点刻み。10の位と1の位を別々に動かす
function bumpScore(d){
  const v=(scPick==null?0:scPick)+d;
  scPick=Math.max(0, Math.min(100, v));
  showScore();
}
function showScore(){
  const v=scPick==null?0:scPick;
  document.getElementById('sc-val').textContent = scPick==null?'—':v;
  document.getElementById('sc-d10').textContent = Math.floor(v/10);
  document.getElementById('sc-d1').textContent  = v%10;
}
function saveScore(){
  if(scPick==null){ alert('点数を選んでください。'); return; }
  const w=byId(curId); if(!w) return;
  w.score=scPick; w.scoredAt=nowISO();
  w.note=document.getElementById('sc-note').value.trim();
  if(w.status!=='done') w.status='done';
  save(); closeModal('m-score'); go('score'); queueSync();
}

// ---------- 追加・編集 ----------
function openEdit(id){
  curId=id;
  const w=id?byId(id):null;
  document.getElementById('edit-title').textContent = w?'作品を編集':'作品を追加';
  document.getElementById('e-title').value = w?w.title:'';
  document.getElementById('e-year').value  = w&&w.year?w.year:'';
  document.getElementById('e-air').value   = w&&w.airDate?w.airDate:'';
  document.getElementById('e-status').value= w?w.status:'watching';
  document.getElementById('e-note').value  = w?(w.note||''):'';
  document.getElementById('e-del').style.display = w?'':'none';
  // 取り込んだクールは日付が無いので、参考として下に出す
  const cour = w && !w.airDate ? airLabel(w) : '';
  document.getElementById('e-air-note').textContent =
    cour ? `取り込み時の情報：${cour}` : '放送開始日を入れると視聴年の裏付けになります。';
  openModal('m-edit');
}
function saveEdit(){
  const t=document.getElementById('e-title').value.trim();
  if(!t){ alert('タイトルを入力してください。'); return; }
  const y=parseInt(document.getElementById('e-year').value,10);
  const air=document.getElementById('e-air').value||null;
  const st=document.getElementById('e-status').value;
  const nt=document.getElementById('e-note').value.trim();
  let w=curId?byId(curId):null;
  if(!w){
    w={id:uid(), seq:nextSeq(), title:t, year:isNaN(y)?null:y, yearEst:false,
       airDate:air, airYear:null, airCour:null, media:null, status:st,
       episodes:[], epScores:[], score:null, scoredAt:null,
       reScore:null, reScoredAt:null, note:nt, source:'app'};
    // 年が空のまま放送日だけ入れた時は、その年を視聴年として当てておく
    if(w.year==null && air) w.year=parseInt(air.slice(0,4),10);
    DB.works.push(w);
  }else{
    w.title=t; w.status=st; w.note=nt; w.airDate=air;
    if(isNaN(y)){
      // 年が空でも放送日を入れたならその年を当てる（推定のまま）
      if(air){ w.year=parseInt(air.slice(0,4),10); w.yearEst=true; }
      else { w.year=null; w.yearEst=false; }
    }else if(w.year!==y){
      w.year=y; w.yearEst=false;                       // 書き換えた年は確定扱い
    }
  }
  save(); closeModal('m-edit'); go('watch'); queueSync();
}
function delWork(){
  if(!curId||!confirm('この作品を削除します。よろしいですか。')) return;
  DB.works=DB.works.filter(w=>w.id!==curId);
  save(); closeModal('m-edit'); go('watch'); queueSync();
}

// ---------- 一覧 ----------
function scCls(v){ return v==null?'':(v>=90?'s90':v>=75?'s75':v>=55?'s55':'s0'); }
function renderList(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const sort=document.getElementById('sort').value;
  const filt=document.getElementById('filt').value;
  let a=DB.works.slice();
  if(q) a=a.filter(w=>w.title.toLowerCase().includes(q));
  if(filt==='unscored') a=a.filter(w=>w.score==null);
  else if(filt!=='all')  a=a.filter(w=>w.status===filt);
  const cmp={
    seq:(x,y)=>y.seq-x.seq, seqAsc:(x,y)=>x.seq-y.seq,
    score:(x,y)=>(y.score??-1)-(x.score??-1), scoreAsc:(x,y)=>(x.score??999)-(y.score??999)
  };
  a.sort(cmp[sort]);
  document.getElementById('list-count').textContent=`${a.length} 件 / 全 ${DB.works.length} 件`;
  const el=document.getElementById('all-list');
  if(!a.length){ el.innerHTML='<div class="empty">該当なし</div>'; return; }
  // 行をタップすると振り返り（話ごとのマークとコメント）が開く
  el.innerHTML=a.slice(0,600).map(w=>{
    const notes=(w.episodes||[]).filter(e=>e.note).length;
    const sub=[ '#'+w.seq, yearLabel(w),
                w.status!=='done'?(STATUS_JA[w.status]||''):'',
                (w.episodes||[]).length?`${(w.episodes||[]).length}話記録`:'',
                notes?`メモ${notes}`:'' ].filter(Boolean).join(' ・ ');
    return `<div class="list-item" onclick="openEps('${w.id}')">
      <div class="sc ${scCls(w.score)}">${w.score==null?'—':w.score}</div>
      <div class="ttl">${esc(w.title)}
        <div class="sub">${esc(sub)}</div>
      </div>
    </div>`;
  }).join('') + (a.length>600?'<div class="empty">先頭600件のみ表示しています。検索で絞り込んでください。</div>':'');
}

// ---------- 統計 ----------
function avg(a){ return a.length? a.reduce((s,v)=>s+v,0)/a.length : null; }
function fx(v){ return v==null?'—':v.toFixed(1); }
function renderStat(){
  const scored=DB.works.filter(w=>typeof w.score==='number');
  const all=scored.map(w=>w.score);
  const bySeq=scored.slice().sort((a,b)=>b.seq-a.seq);
  const years={}; scored.forEach(w=>{ if(w.year){ (years[w.year]=years[w.year]||[]).push(w.score); } });
  const yk=Object.keys(years).map(Number).sort((a,b)=>b-a);
  const latestY = yk.length?yk[0]:null;

  const hist=new Array(11).fill(0);
  all.forEach(v=>{ hist[Math.min(10,Math.floor(v/10))]++; });
  const hmax=Math.max(...hist,1);

  let h=`<div class="stat">
    <div class="b"><div class="n">${scored.length}</div><div class="l">採点済み作品数</div></div>
    <div class="b"><div class="n">${fx(avg(all))}</div><div class="l">自己平均（全期間）</div></div>
    <div class="b"><div class="n">${fx(avg(bySeq.slice(0,20).map(w=>w.score)))}</div><div class="l">直近20件の平均</div></div>
    <div class="b"><div class="n">${fx(avg(bySeq.slice(0,50).map(w=>w.score)))}</div><div class="l">直近50件の平均</div></div>
  </div>`;

  h+=`<div class="card"><h3>年別の平均</h3>`;
  if(latestY!=null){
    h+=`<div class="note">直近1年（${latestY}年）の平均は <b>${fx(avg(years[latestY]))}</b> 点（${years[latestY].length}件）です。</div>`;
    h+=yk.map(y=>`<div class="list-item"><div class="sc ${scCls(avg(years[y]))}">${fx(avg(years[y]))}</div>
      <div class="ttl">${y}年<div class="sub">${years[y].length}件</div></div></div>`).join('');
  }else{
    h+=`<div class="note">視聴年が入っている作品がありません。</div>`;
  }
  const noYear=scored.filter(w=>!w.year).length;
  const estY=scored.filter(w=>w.year&&w.yearEst).length;
  if(noYear) h+=`<div class="note">※ 視聴年が不明な ${noYear} 件は年別集計から除外しています。年別ではなく「直近N件」でも傾向を見てください。</div>`;
  if(estY)   h+=`<div class="note">※ うち ${estY} 件は放送クールと視聴順から推定した年です。前後1年ずれることがあります。</div>`;
  h+=`</div>`;

  h+=`<div class="card"><h3>点数の分布</h3><div class="histwrap"><div class="hist">`;
  for(let i=0;i<11;i++){
    const lab=i===10?'100':(i*10)+'';
    h+=`<div class="bar" style="height:${hist[i]/hmax*100}%" title="${hist[i]}件"><span>${lab}</span></div>`;
  }
  h+=`</div></div><div class="note">最頻値の帯：${hist.indexOf(hmax)*10}点台（${hmax}件）。自分の採点の癖が偏っていないか確認できます。</div></div>`;

  const re=scored.filter(w=>w.scoredAt && w.reScore==null &&
    (Date.now()-new Date(w.scoredAt).getTime())>30*86400000);
  h+=`<div class="card"><h3>再評価の候補</h3>
    <div class="note">採点から30日以上たった作品です。余韻が残っているかで見直せます。</div>`;
  h+= re.length ? re.slice(0,20).map(w=>`<div class="list-item" onclick="openScore('${w.id}')">
        <div class="sc ${scCls(w.score)}">${w.score}</div><div class="ttl">${esc(w.title)}</div></div>`).join('')
    : `<div class="note">候補はありません。</div>`;
  h+=`</div>`;

  document.getElementById('stat-body').innerHTML=h;
}

// ---------- 設定 ----------
const FS_KEYS=['s','m','l','xl'];
function curFs(){ const v=localStorage.getItem(LS_FS); return FS_KEYS.includes(v)?v:'m'; }
function setFs(v){
  if(!FS_KEYS.includes(v)) return;
  document.documentElement.dataset.fs=v;
  try{ localStorage.setItem(LS_FS,v); }catch(e){}
  markFs();
}
function markFs(){
  const c=curFs();
  FS_KEYS.forEach(k=>{
    const b=document.getElementById('fs-'+k);
    if(b) b.classList.toggle('on', k===c);
  });
}
function renderConf(){
  markFs();
  document.getElementById('anchor-fields').innerHTML=ANCHOR_KEYS.map(k=>
    `<label class="f">${k} 点の基準作品</label><input type="text" id="a-${k}" value="${esc(DB.anchors[k]||'')}">`).join('');
  document.getElementById('gh-token').value=localStorage.getItem(LS_TOKEN)||'';
  document.getElementById('gh-gist').value =localStorage.getItem(LS_GIST)||'';
  const scored=DB.works.filter(w=>typeof w.score==='number').length;
  document.getElementById('data-info').textContent=
    `作品 ${DB.works.length} 件（採点済み ${scored} 件） / 最終更新 ${DB.updatedAt||'—'}`;
}
function saveAnchors(){
  ANCHOR_KEYS.forEach(k=>{ DB.anchors[k]=document.getElementById('a-'+k).value.trim(); });
  save(); alert('保存しました。'); queueSync();
}
function saveGistConf(){
  localStorage.setItem(LS_TOKEN, document.getElementById('gh-token').value.trim());
  localStorage.setItem(LS_GIST,  document.getElementById('gh-gist').value.trim());
  msg('gist-msg','設定を保存しました。');
}
function msg(id,t){ document.getElementById(id).textContent=t; }

// ---------- インポート / エクスポート ----------
function doImport(){
  const f=document.getElementById('imp-file').files[0];
  if(!f){ alert('ファイルを選んでください。'); return; }
  const r=new FileReader();
  r.onload=()=>{
    let j; try{ j=JSON.parse(r.result); }catch(e){ msg('imp-msg','JSONとして読めませんでした。'); return; }
    const src = Array.isArray(j) ? j : (j.works||[]);
    if(!src.length){ msg('imp-msg','works が見つかりません。'); return; }
    const seen=new Set(DB.works.map(w=>w.title));
    let add=0, skip=0;
    src.forEach(s=>{
      const t=(s.title||'').trim(); if(!t) return;
      if(seen.has(t)){ skip++; return; }
      seen.add(t);
      DB.works.push({
        id:uid(), seq: s.seq!=null?s.seq:nextSeq(), title:t,
        year: s.year!=null?s.year:null,
        yearEst: !!s.yearEst,
        airDate: s.airDate||null,
        airYear: s.airYear!=null?s.airYear:null,
        airCour: s.airCour!=null?s.airCour:null,
        media: s.media||null,
        status: s.status || (s.score!=null?'done':'watching'),
        episodes: s.episodes||[], epScores: s.epScores||[],
        score: s.score!=null?s.score:null,
        scoredAt: s.scoredAt||null, reScore:null, reScoredAt:null,
        note: s.note||'', source: s.source||'import'
      });
      add++;
    });
    save();
    msg('imp-msg',`${add} 件を追加しました（タイトル重複で ${skip} 件スキップ）。`);
    renderConf(); queueSync();
  };
  r.readAsText(f,'utf-8');
}
function doExport(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ani-rate_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function wipe(){
  if(!confirm('この端末の保存データを消します。Gist 側は消えません。よろしいですか。')) return;
  localStorage.removeItem(LS_DB); load(); go('watch');
}

// ---------- Gist 同期 ----------
const GFILE='ani-rate.json';
function ghConf(){ return {tk:localStorage.getItem(LS_TOKEN)||'', id:localStorage.getItem(LS_GIST)||''}; }
function setSync(t){ document.getElementById('sync-state').textContent=t; }

// 未送信フラグ。圏外で入力した分はここで覚えて復帰時に送る
function setPending(v){ try{ localStorage.setItem(LS_PEND, v?'1':'0'); }catch(e){} }
function isPending(){ return localStorage.getItem(LS_PEND)==='1'; }
function showSync(){
  const {tk,id}=ghConf();
  if(!tk||!id){ setSync('ローカルのみ'); return; }
  if(!navigator.onLine){ setSync(isPending()?'圏外・未送信あり':'圏外'); return; }
  setSync(isPending()?'未送信あり':'同期済み');
}

async function gh(path,opt){
  const {tk}=ghConf();
  if(!tk) throw new Error('トークンが未設定です。');
  const r=await fetch('https://api.github.com'+path, Object.assign({
    headers:{'Authorization':'Bearer '+tk,'Accept':'application/vnd.github+json'}
  },opt||{}));
  if(!r.ok) throw new Error('GitHub API '+r.status);
  return r.json();
}
async function gistCreate(){
  try{
    const j=await gh('/gists',{method:'POST',body:JSON.stringify({
      description:'ani-rate data', public:false,
      files:{[GFILE]:{content:JSON.stringify(DB)}}
    })});
    localStorage.setItem(LS_GIST,j.id);
    document.getElementById('gh-gist').value=j.id;
    msg('gist-msg','Gist を作成しました： '+j.id);
    gistBase=DB.updatedAt; setPending(false); showSync();
  }catch(e){ msg('gist-msg','失敗： '+e.message); }
}
async function gistPull(){
  const {id}=ghConf();
  if(!id){ msg('gist-msg','Gist ID が未設定です。'); return; }
  try{
    const j=await gh('/gists/'+id);
    const f=j.files&&j.files[GFILE];
    if(!f){ msg('gist-msg','Gist に '+GFILE+' がありません。'); return; }
    const txt=f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    const d=JSON.parse(txt);
    if(!confirm(`Gist の内容でこの端末を上書きします。\nGist 側 ${(d.works||[]).length} 件 / この端末 ${DB.works.length} 件\nよろしいですか。`)) return;
    DB=d; gistBase=d.updatedAt; save(false);
    setPending(false); showSync();
    msg('gist-msg','取り込みました。'); go('watch');
  }catch(e){ msg('gist-msg','失敗： '+e.message); }
}
async function gistPush(manual){
  const {tk,id}=ghConf();
  if(!tk||!id){ if(manual) msg('gist-msg','トークンと Gist ID を設定してください。'); return; }
  if(!navigator.onLine){ setPending(true); showSync(); if(manual) msg('gist-msg','圏外です。オンライン復帰時に自動送信します。'); return; }
  try{
    const cur=await gh('/gists/'+id);
    const f=cur.files&&cur.files[GFILE];
    if(f){
      const txt=f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      const remote=JSON.parse(txt);
      // 別端末が先に書いていたら上書き前に確認する
      if(gistBase && remote.updatedAt && remote.updatedAt!==gistBase){
        if(!confirm(`Gist 側が別の端末で更新されています。\nGist ${remote.updatedAt}\nこの端末 ${DB.updatedAt}\n上書きしますか。`)) return;
      }
    }
    await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(DB)}}})});
    gistBase=DB.updatedAt;
    setPending(false); showSync();
    if(manual) msg('gist-msg','送信しました。');
  }catch(e){
    setPending(true); showSync();
    msg('gist-msg','送信できませんでした（'+e.message+'）。復帰時に再送します。');
  }
}

let syncT=null;
function queueSync(){
  updateBadge();
  setPending(true); showSync();
  const {tk,id}=ghConf(); if(!tk||!id) return;
  if(syncT) clearTimeout(syncT);
  syncT=setTimeout(()=>{ syncT=null; gistPush(false); }, 4000);
}

// 圏外復帰・定期再試行。ためた入力はここで送り切る
window.addEventListener('online',  ()=>{ showSync(); if(isPending()) gistPush(false); });
window.addEventListener('offline', showSync);
setInterval(()=>{ if(isPending() && navigator.onLine) gistPush(false); }, 60000);
function updateBadge(){
  const n=unscored().length, b=document.getElementById('b-score');
  b.textContent=n; b.style.display=n?'':'none';
}

// ---------- 起動 ----------
load();
updateBadge();
go('watch');
showSync();

// オフラインでも開けるようにアプリ本体をキャッシュする（file:// では登録されない）
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

(async ()=>{
  const {tk,id}=ghConf();
  if(!tk||!id || !navigator.onLine) return;
  try{
    const j=await gh('/gists/'+id);
    const f=j.files&&j.files[GFILE]; if(!f) return;
    const txt=f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    const d=JSON.parse(txt);
    gistBase=d.updatedAt;
    // 未送信を抱えている時は取り込まない。圏外中の入力を消さないため
    if(isPending()){ gistPush(false); updateBadge(); return; }
    // 起動時はGistの方が新しい場合のみ取り込む
    if(!DB.updatedAt || (d.updatedAt && d.updatedAt>DB.updatedAt)){
      DB=d; save(false); go('watch');
    }
    setPending(false); showSync(); updateBadge();
  }catch(e){ setSync('同期エラー'); }
})();
</script>
